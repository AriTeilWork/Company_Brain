# Company Brain gateway (LXC 1, harri-lamp-22, 10.0.3.122)
# Installed at: /etc/nginx/sites-available/company-brain
# Enabled via:  ln -s /etc/nginx/sites-available/company-brain /etc/nginx/sites-enabled/
# Apply:        nginx -t && systemctl reload nginx

server {
    listen 80 default_server;
    server_name _;

    # Gateway's own health check
    location = /health {
        default_type text/plain;
        return 200 "gateway ok\n";
    }

    # API requests are forwarded to FastAPI on the application container (LXC 2)
    location /api/ {
        proxy_pass http://10.0.3.123:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        default_type text/plain;
        return 200 "Company Brain gateway\n";
    }
}
